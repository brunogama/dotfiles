# Agent account identity - one harness-agnostic account shared by every coding
# agent and repository.
#
# The coding-agent CLI wrappers read this file to set git and jj commit
# authorship and to mint an authenticated GitHub token. Identity is shared by
# every coding agent and repository. Token minting first reuses the user's gh
# login (gh auth token); when no gh login exists it falls back to a GitHub App
# installation token scoped per repository by the App installation.
#
# Format: KEY=VALUE, no spaces around "=", no quotes. A "#" starts a comment.
#
# Leave AGENT_NAME empty to disable identity overrides entirely. The GitHub App
# private key is a secret and belongs in the credentials backend, never here.

AGENT_NAME=Bruno
AGENT_EMAIL=bruno@multivac.local

# GitHub App ID used to mint installation tokens. Empty disables token minting
# until the App is created.
#
# The App private key (PEM) is a secret and is read automatically from the
# credentials backend under a fixed key:
#   credfile put GITHUB_APP_PRIVATE_KEY /path/to/private-key.pem
GITHUB_APP_ID=
