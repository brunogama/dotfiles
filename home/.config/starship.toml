# Starship prompt configuration converted from the previous two-line setup.
# Keep the prompt sparse: environment + directory + Git on the left, contextual
# runtime and cloud information on the right, and the prompt character below.

palette = "lean"
add_newline = true
command_timeout = 800
scan_timeout = 30

format = """
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$line_break\
$character"""

right_format = """$status\
$cmd_duration\
$jobs\
$direnv\
$python\
$conda\
$nodejs\
$ruby\
$lua\
$java\
$perl\
$php\
$scala\
$swift\
$golang\
$rust\
$package\
$kubernetes\
$terraform\
$aws\
$azure\
$gcloud\
$nix_shell\
$docker_context\
$vagrant\
$container\
$shlvl\
$username\
$hostname"""

continuation_prompt = "[▶▶](faint shortened) "

[profiles]
transient = "$character"

[palettes.lean]
clean = "76"
modified = "178"
untracked = "39"
conflicted = "196"
directory = "31"
anchor = "39"
shortened = "103"
duration = "101"
context = "180"

[character]
success_symbol = "[❯](bold clean)"
error_symbol = "[❯](bold conflicted)"
vimcmd_symbol = "[❮](bold clean)"
vimcmd_visual_symbol = "[❮](bold modified)"
vimcmd_replace_symbol = "[❮](bold 168)"
vimcmd_replace_one_symbol = "[❮](bold 168)"

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
repo_root_format = """
[$before_root_path]($before_repo_root_style)\
[$repo_root]($repo_root_style)\
[$path]($style)\
[$read_only]($read_only_style) """
style = "bold directory"
repo_root_style = "bold anchor"
before_repo_root_style = "shortened"
read_only = " 󰌾"
read_only_style = "conflicted"
truncation_length = 8
truncate_to_repo = true
truncation_symbol = "…/"
home_symbol = "~"

[git_branch]
format = "[$branch(:$remote_branch)]($style) "
symbol = ""
style = "bold clean"
truncation_length = 32
truncation_symbol = "…"

[git_commit]
commit_hash_length = 8
format = "[$hash$tag]($style) "
style = "bold clean"
only_detached = true
tag_symbol = "#"
tag_disabled = false

[git_state]
format = "[($state $progress_current/$progress_total)]($style) "
style = "bold modified"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold modified"
stashed = "*${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = "[~${count}](bold conflicted)"
deleted = "[-${count}](bold modified)"
renamed = "[»${count}](bold modified)"
modified = "[!${count}](bold modified)"
staged = "[+${count}](bold clean)"
untracked = "[?${count}](bold untracked)"

[status]
disabled = false
format = "[$symbol$status]($style) "
symbol = "✘ "
success_symbol = ""
not_executable_symbol = "✘ "
not_found_symbol = "✘ "
sigint_symbol = "✘ INT "
signal_symbol = "✘ $signal_name "
style = "bold conflicted"
map_symbol = true
recognize_signal_code = true
pipestatus = true
pipestatus_separator = "|"
pipestatus_format = "[$pipestatus]($style) "

[cmd_duration]
min_time = 3000
format = "[$duration]($style) "
style = "duration"
show_milliseconds = false

[jobs]
threshold = 1
symbol_threshold = 1
format = "[$symbol]($style) "
symbol = "✦"
style = "bold 70"

[direnv]
disabled = false
format = "[$symbol$loaded/$allowed]($style) "
symbol = "direnv "
style = "bold modified"

[python]
style = "bold 37"

[conda]
style = "bold 37"

[nodejs]
style = "bold 70"

[ruby]
style = "bold 168"

[lua]
style = "bold 32"

[java]
style = "bold 32"

[perl]
style = "bold 67"

[php]
style = "bold 99"

[scala]
style = "bold 160"

[swift]
style = "bold 38"

[golang]
style = "bold 37"

[rust]
style = "bold 37"

[package]
style = "bold 117"

[kubernetes]
disabled = false
style = "bold 134"

[terraform]
style = "bold 38"

[aws]
style = "bold 208"

[azure]
style = "bold 32"

[gcloud]
style = "bold 32"

[nix_shell]
style = "bold 74"

[shlvl]
disabled = false
threshold = 2
style = "bold context"

[username]
format = "[$user]($style)@"
style_user = "bold context"
style_root = "bold modified"
show_always = false

[hostname]
ssh_only = true
format = "[$hostname]($style) "
style = "bold context"
trim_at = "."
