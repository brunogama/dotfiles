---
# Pre-commit hooks configuration
# Enforces code quality and MINDSET constitutional rules
#
# Installation:
#   bin/core/setup-git-hooks
#
# Manual run:
#   pre-commit run --all-files
#
# Skip hooks (not recommended):
#   git commit --no-verify

repos:
  # ShellCheck - use the system binary installed by Nix, Homebrew, or CI.
  - repo: local
    hooks:
      # Apply formatter fixes and re-stage them before validation hooks run.
      - id: format-and-stage
        name: Format and stage files
        entry: bin/git/hooks/format-and-stage
        language: script
        types: [text]
        require_serial: true
        exclude: ^(\.git|\.claude)

      - id: shellcheck
        name: ShellCheck (system)
        entry: shellcheck
        language: system
        types: [shell]
        args: ["--severity=error"]
        exclude: >-
          (?x)^(
            \.git|
            \.claude|
            ai_docs/legacy|
            home/\.zshenv|
            home/\.config/zsh/|
            zsh/|
            bin/core/zsh-|
            bin/credentials/secure-store-api|
            tests/helpers/bats-|
            tests/fixtures/repos/|
            tests/.*\.bats$
          )

      # ShellCheck does not support Zsh syntax. Validate all maintained Zsh
      # sources with the interpreter instead of silently omitting them.
      - id: zsh-syntax
        name: Zsh syntax validation
        entry: zsh -n --
        language: system
        files: >-
          ^(home/\.zshenv|home/\.config/zsh/|zsh/|bin/core/zsh-)

  # Gitleaks - scan staged changes for hardcoded secrets.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # Validate YAML syntax
      - id: check-yaml
        exclude: ^(\.git|\.claude)

      # Validate JSON syntax
      - id: check-json
        exclude: ^(\.git|\.claude)

      # Check for merge conflict markers
      - id: check-merge-conflict

  # Custom local hooks
  - repo: local
    hooks:
      # Check for emojis (MINDSET Rule 2)
      - id: no-emojis
        name: Check for emojis (MINDSET Rule 2)
        entry: bin/git/hooks/check-no-emojis
        language: script
        types: [text]
        exclude: ^(\.git|\.claude|ai_docs/legacy|\.genesis/)

      # Check for uppercase directories (MINDSET Rule 1)
      - id: lowercase-dirs
        name: Check directories are lowercase (MINDSET Rule 1)
        entry: bin/git/hooks/check-lowercase-dirs
        language: script
        pass_filenames: false
        exclude: ^(\.git|\.claude)

      # OpenSpec validation
      - id: openspec-validate
        name: Validate OpenSpec proposals
        entry: bin/git/hooks/validate-openspec
        language: script
        files: openspec/changes/.*\.(md|yaml)$

      # Conventional commit message
      - id: conventional-commit
        name: Check conventional commit format
        entry: bin/git/hooks/check-commit-msg
        language: script
        stages: [commit-msg]
        always_run: true
