---
# macOS CI - runs on GitHub Actions macOS runners (Depot CI is Linux-only).
name: CI (macOS)

"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          brew install shellcheck jq
          python -m pip install --upgrade pip uv

      - name: Verify local CI regression tests
        run: |
          python tests/test_ci_workflow.py

      - name: Run pre-commit hooks
        uses: pre-commit/action@646c83fcd040023954eafda54b4db0192ce70507
        env:
          # Commit-time hooks enforce these on changed files. Running them over
          # the historical repository would create unrelated formatting edits.
          SKIP: trailing-whitespace,end-of-file-fixer

      - name: Validate MINDSET rules
        run: |
          echo "Checking for uppercase directories..."
          bin/git/hooks/check-lowercase-dirs

          echo "Checking for emojis..."
          git ls-files | while IFS= read -r file; do
            if [[ -f "$file" ]] &&
              [[ "$file" =~ \.(md|sh|zsh|bash|txt)$ ]]; then
              bin/git/hooks/check-no-emojis "$file" || exit 1
            fi
          done

      - name: Shellcheck all scripts
        run: |
          find bin/ -type f \
            \( -name "*.sh" -o -name "*.bash" -o -name "*.zsh" \) \
            -print0 |
          while IFS= read -r -d '' script; do
            echo "Checking: $script"
            shellcheck --severity=error "$script" || exit 1
          done

      - name: Test installation script syntax
        run: |
          bash -n install
          echo "Installation script syntax is valid"

      - name: Validate OpenSpec proposals
        if: hashFiles('openspec/changes/**/*.md') != ''
        run: |
          if command -v openspec &>/dev/null; then
            for proposal in openspec/changes/*/; do
              proposal_name=$(basename "$proposal")
              echo "Validating: $proposal_name"
              openspec validate "$proposal_name" --strict || exit 1
            done
          else
            echo "OpenSpec not available, skipping validation"
          fi

  validate-nix:
    name: Validate Nix configuration
    runs-on: macos-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342

      - name: Evaluate Home Manager and nix-darwin configurations
        run: ./bin/core/nix-validate

      - name: Verify instant Dock timing
        run: |
          dock_defaults="$(
            nix eval --json \
              .#darwinConfigurations.default.config.system.defaults.dock
          )"
          jq -e '
            ."autohide-delay" == 0 and
            ."autohide-time-modifier" == 0
          ' <<< "$dock_defaults"

  test-macos:
    name: Test on macOS
    runs-on: macos-latest
    needs: validate-nix

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Test dry-run installation
        run: |
          ./install --dry-run

      - name: Test link-dotfiles
        run: |
          bin/core/link-dotfiles.py --dry-run

      - name: Test script help messages
        run: |
          for script in bin/core/* bin/credentials/* bin/git/*; do
            if [[ -x "$script" ]] && [[ -f "$script" ]]; then
              echo "Testing: $(basename "$script")"
              perl -e 'alarm 5; exec @ARGV' "$script" --help &>/dev/null ||
                echo "No help: $script"
            fi
          done

  test-integration-macos:
    name: Integration Tests (macOS)
    runs-on: macos-latest
    needs: test-macos

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Bats and GNU Parallel
        run: |
          brew install bats-core parallel

      - name: Run maintained integration tests
        run: |
          bats --tap --jobs "${BATS_JOBS:-2}" \
            tests/integration/core/test_install.bats \
            tests/integration/core/test_work_mode.bats

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: integration-test-results-macos
          path: test-results/

  install-nix-macos:
    name: End-to-end Nix install (macOS)
    runs-on: macos-latest
    needs: test-integration-macos
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342

      - name: Run a complete user installation
        run: |
          ./install --nix --yes \
            --username "$USER" \
            --machine-name "Dotfiles CI"

      - name: Verify configured host identity
        run: |
          grep -Fq "username = \"$USER\";" nix/host.nix
          grep -Fq 'configurationName = "dotfiles-ci";' nix/host.nix
          grep -Fq 'computerName = "Dotfiles CI";' nix/host.nix
          grep -Fq 'hostName = "dotfiles-ci";' nix/host.nix
          grep -Fq 'localHostName = "dotfiles-ci";' nix/host.nix

      - name: Verify managed files and shell
        run: |
          profile_path="/etc/profiles/per-user/$USER/bin"
          export PATH="$HOME/.nix-profile/bin:$profile_path:$PATH"
          for path in \
            "$HOME/.zshenv" \
            "$HOME/.config/zsh/.zshrc" \
            "$HOME/.config/starship.toml" \
            "$HOME/.pi/agent/AGENTS.md" \
            "$HOME/.codex/AGENTS.md" \
            "$HOME/.claude/CLAUDE.md"; do
            test -L "$path"
          done
          test -f "$HOME/.config/zsh/.zshrc.zwc"
          ZDOTDIR="$HOME/.config/zsh" zsh -lic \
            'command -v starship >/dev/null && command -v git >/dev/null'

      - name: Verify installed tools
        run: |
          profile_path="/etc/profiles/per-user/$USER/bin"
          export PATH="$HOME/.nix-profile/bin:$profile_path:$PATH"
          for command in git home-manager jq rg shellcheck starship zsh; do
            command -v "$command" >/dev/null
          done
          test -x \
            "$HOME/.local/share/dotfiles/npm/current/node_modules/.bin/pi"
          home-manager generations

