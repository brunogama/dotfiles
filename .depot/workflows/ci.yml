---
# Linux CI - runs on Depot CI sandboxes. macOS jobs live in .github/workflows/ci.yml.
name: CI (Linux)

"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: depot-ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck zsh
          python -m pip install --upgrade pip uv

      - name: Verify local CI regression tests
        run: |
          python tests/test_ci_workflow.py

      - name: Run pre-commit hooks
        uses: pre-commit/action@646c83fcd040023954eafda54b4db0192ce70507
        env:
          # Commit-time hooks enforce these on changed files. Running them over
          # the historical repository would create unrelated formatting edits.
          SKIP: trailing-whitespace,end-of-file-fixer

      - name: Validate MINDSET rules
        run: |
          echo "Checking for uppercase directories..."
          bin/git/hooks/check-lowercase-dirs

          echo "Checking for emojis..."
          git ls-files | while IFS= read -r file; do
            if [[ -f "$file" ]] &&
              [[ "$file" =~ \.(md|sh|zsh|bash|txt)$ ]]; then
              bin/git/hooks/check-no-emojis "$file" || exit 1
            fi
          done

      - name: Shellcheck all scripts
        run: |
          find bin/ -type f \
            \( -name "*.sh" -o -name "*.bash" -o -name "*.zsh" \) \
            -print0 |
          while IFS= read -r -d '' script; do
            echo "Checking: $script"
            shellcheck --severity=error "$script" || exit 1
          done

      - name: Test installation script syntax
        run: |
          bash -n install
          echo "Installation script syntax is valid"

      - name: Validate OpenSpec proposals
        if: hashFiles('openspec/changes/**/*.md') != ''
        run: |
          if command -v openspec &>/dev/null; then
            for proposal in openspec/changes/*/; do
              proposal_name=$(basename "$proposal")
              echo "Validating: $proposal_name"
              openspec validate "$proposal_name" --strict || exit 1
            done
          else
            echo "OpenSpec not available, skipping validation"
          fi

  test-linux:
    name: Test on Linux
    runs-on: depot-ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck

      - name: Test dry-run installation
        run: |
          ./install --dry-run

      - name: Test link-dotfiles
        run: |
          bin/core/link-dotfiles.py --dry-run

  test-python:
    name: Test Python Packages
    runs-on: depot-ubuntu-latest
    needs: test-linux

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv==0.11.32

      - name: Test home-sync package
        run: |
          cd bin/core/home_sync
          uv sync --extra dev

          # Run all tests with coverage
          uv run pytest tests/ -v \
            --cov=home_sync \
            --cov-report=term-missing \
            --cov-report=xml

          # Verify minimum coverage (91%)
          uv run coverage report --fail-under=91

      - name: Run mypy strict type checking
        run: |
          cd bin/core/home_sync
          uv run mypy home_sync --strict

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          files: ./bin/core/home_sync/coverage.xml
          flags: home-sync
          name: home-sync-coverage

  mutation-testing:
    name: Mutation Testing
    runs-on: depot-ubuntu-latest
    needs: test-python

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv==0.11.32

      - name: Run mutation tests on home-sync
        run: |
          cd bin/core/home_sync
          uv sync --extra dev
          uv pip install mutmut==2.4.5

          # Keep mutation testing bounded to the metrics module and its focused
          # tests. The default runner executes the entire suite per mutant.
          mutation_runner="python -m pytest -x --assert=plain -q"
          mutation_runner+=" tests/test_metrics.py"
          uv run mutmut run \
            --paths-to-mutate=home_sync/metrics.py \
            --runner "$mutation_runner" \
            --no-progress \
            --CI
          uv run mutmut results
          uv run mutmut html
          uv run mutmut junitxml > mutation-results.xml

          # Verify minimum mutation score (80%) from mutmut's JUnit report.
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("mutation-results.xml").getroot()
          total = int(root.attrib["tests"])
          survived = int(root.attrib["failures"]) + int(root.attrib["errors"])
          score = 100 if total == 0 else 100 - survived * 100 // total
          print(f"Mutation score: {score}%")
          if score < 80:
              raise SystemExit("Mutation score below 80% threshold")
          PY

      - name: Upload mutation test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mutation-test-results
          path: bin/core/home_sync/html/

  test-integration-linux:
    name: Integration Tests (Linux)
    runs-on: depot-ubuntu-latest
    needs: mutation-testing

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Bats and GNU Parallel
        run: |
          sudo apt-get update
          sudo apt-get install -y bats parallel

      - name: Run maintained integration tests
        run: |
          bats --tap --jobs "${BATS_JOBS:-2}" \
            tests/integration/core/test_install.bats \
            tests/integration/core/test_work_mode.bats

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: integration-test-results-linux
          path: test-results/

  documentation:
    name: Check Documentation
    runs-on: depot-ubuntu-latest
    needs: test-integration-linux

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Check for broken markdown links
        uses: "gaurav-nelson/github-action-markdown-link-check@\
          5c5dfc0ac2e225883c0e5f03a85311ec2830d368"
        with:
          use-quiet-mode: "yes"
          config-file: ".github/markdown-link-check.json"
        continue-on-error: true

      - name: Validate documentation structure
        run: |
          required_docs=(
            "README.md"
            "MINDSET.MD"
            "AGENTS.md"
          )

          for doc in "${required_docs[@]}"; do
            if [[ ! -f "$doc" ]]; then
              echo "ERROR: Missing required documentation: $doc"
              exit 1
            fi
          done

          echo "All required documentation present"

      - name: Check for TODO/FIXME comments
        run: |
          todos=$(grep -r "TODO\|FIXME" bin/ zsh/ git/ \
            --exclude-dir=.git || true)
          if [[ -n "$todos" ]]; then
            echo "Found TODO/FIXME comments:"
            echo "$todos"
          fi

