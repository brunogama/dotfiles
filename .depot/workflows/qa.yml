# Depot CI Migration
# Source: .github/workflows/qa.yml
#
# Changes made:
# - Changed GitHub runs-on labels to their Depot equivalents

name: Agent repository QA
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs so a newer push stops the previous run.
concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  deterministic-qa:
    # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    runs-on: depot-ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Validate agent repository
        run: uv run scripts/qa_repository.py .
