---
# Formatter-only hooks run by bin/git/hooks/format-and-stage.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: >-
          (?x)^(
            \.git/|
            \.claude/|
            docs/assets/architecture/diagrams/.*\.svg$
          )

      - id: end-of-file-fixer
        exclude: >-
          (?x)^(
            \.git/|
            \.claude/|
            docs/assets/architecture/diagrams/.*\.svg$
          )

      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: >-
          (?x)^(
            \.git/|
            \.claude/|
            docs/assets/architecture/diagrams/.*\.svg$
          )
