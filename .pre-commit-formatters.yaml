---
# Formatter-only hooks run by bin/git/hooks/format-and-stage.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(\.git/|\.claude/)

      - id: end-of-file-fixer
        exclude: ^(\.git/|\.claude/)

      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: ^(\.git/|\.claude/)
